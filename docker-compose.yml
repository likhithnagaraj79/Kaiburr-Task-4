version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: task-mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=taskdb
    volumes:
      - mongodb_data:/data/db
    networks:
      - task-network

  task-api:
    build:
      context: ./task-api
      dockerfile: Dockerfile
    container_name: task-api
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/taskdb
    depends_on:
      - mongodb
    networks:
      - task-network

  task-ui:
    build:
      context: ./task-manager-ui
      dockerfile: Dockerfile
    container_name: task-ui
    ports:
      - "3000:80"
    depends_on:
      - task-api
    networks:
      - task-network

volumes:
  mongodb_data:

networks:
  task-network:
    driver: bridge